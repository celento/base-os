# DOSBox Staging settings for BaseOS. This file sits next to the DOSBOX
# program, which makes DOSBox use the portable layout and keep its settings
# in this folder. Run "config -wc" inside DOSBox to write out every option.

[sdl]
output           = texturenb
texture_renderer = software
windowresolution = 640x480
fullscreen       = false

[render]
aspect = true

[cpu]
core    = normal
cputype = auto
# Fixed speeds, the DOSBox Staging defaults. The older "cycles = auto" runs
# protected mode programs at "max", which shrinks the speed to a few hundred
# cycles when the host is slow (QEMU without hardware acceleration), so DOS
# extender programs such as NetHack took many minutes to start.
cpu_cycles           = 3000
cpu_cycles_protected = 60000
cpu_throttle         = false

[autoexec]
# Lines here run after DOSBox starts, for example:
# mount c /disk1/DOS
# c:
